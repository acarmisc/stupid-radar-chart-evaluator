[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contrib-estimator"
version = "0.2.0"
description = "Estimate codebase contribution sources (author/ai/team/research/unspecified) as a 5-axis radar chart."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "contrib-estimator authors" },
]
keywords = ["llm", "code-provenance", "ai-detection", "git", "static-analysis", "litellm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "litellm>=1.50",
    "pydantic>=2.7",
    "click>=8.1",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
contrib-estimator = "contrib_estimator.cli:main"

[project.urls]
Homepage = "https://github.com/acarmisc/stupid-radar-chart-evaluator"
Repository = "https://github.com/acarmisc/stupid-radar-chart-evaluator"
Issues = "https://github.com/acarmisc/stupid-radar-chart-evaluator/issues"

[tool.setuptools.packages.find]
where = ["src"]
