[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contrib-estimator"
version = "0.1.0"
description = "Estimate codebase contribution sources (author/ai/team/research/unspecified) as a radar chart."
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.50",
    "pydantic>=2.7",
    "click>=8.1",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
contrib-estimator = "contrib_estimator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
